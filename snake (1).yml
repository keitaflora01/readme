# Génère le calendrier de contributions animé (« snake ») à partir de vos VRAIES contributions
# et le publie sur la branche `output` de ce dépôt, d'où le README le charge.
# Lancer une première fois à la main : onglet Actions > « Generate contribution snake » > Run workflow.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *" # toutes les 12 heures
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the SVG files (light and dark, brand colours)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=0B2348&color_dots=#E6ECF2,#BFE3CF,#7CC29C,#278653,#0B2348
            dist/github-snake-dark.svg?color_snake=#F4F7FA&color_dots=#161B22,#14452F,#1E6B45,#278653,#4CC38A

      - name: Publish to the output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Generate contribution snake"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" output
